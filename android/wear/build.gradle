// SpinSync HR — Wear OS companion app.
//
// Self-contained buildscript so the root android/build.gradle stays untouched
// (same pattern used by node_modules/@capgo/capacitor-health/android/build.gradle).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.spinsync.wear"
    compileSdk = 34

    defaultConfig {
        // Same applicationId as the phone app. Not required by the BLE approach,
        // but keeps the Wearable Data Layer fallback viable at zero cost.
        applicationId "com.spinsync.app"

        // Deliberately NOT rootProject.ext.minSdkVersion (26) — Wear OS 3 / Health
        // Services need API 30, and foregroundServiceType="health" needs targetSdk 34.
        minSdkVersion 30
        targetSdkVersion 34

        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    // Plain Views, no Compose: the UI is one screen with a button, and enabling
    // Compose would slow down every root-level `gradlew assembleDebug`.
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.lifecycle:lifecycle-service:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.wear:wear:1.3.0"

    // Quick-start tile: one swipe from the watch face instead of digging through the
    // app launcher with gloves on.
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-material:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-expression:1.2.1"

    // Heart rate sampling
    implementation "androidx.health:health-services-client:1.0.0-rc02"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"
    // Health Services exposes ListenableFuture. Without a real Guava on the compile
    // classpath, dependency resolution lands on the empty
    // `listenablefuture:9999.0-empty-to-avoid-conflict-with-guava` stub and the class
    // vanishes at compile time.
    implementation "com.google.guava:guava:33.3.1-android"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    compileOnly "com.google.android.wearable:wearable:2.9.0"
}
